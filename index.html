<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 马六甲跨年互动盛典 (AI Powered)</title>
    <!-- 引入 Tailwind CSS 驱动视觉 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        /* 极致烟花升空动画 */
        @keyframes rise {
            0% { transform: translateY(0) scaleX(0.5); opacity: 0; }
            5% { opacity: 0.8; }
            75% { transform: translateY(-75vh) scaleX(1); opacity: 0.8; }
            80% { opacity: 1; }
            100% { transform: translateY(-75vh) scaleX(1); opacity: 0; }
        }

        /* 文字爆炸动画 */
        @keyframes explode {
            0% { transform: scale(0); opacity: 0; filter: blur(30px); }
            5% { opacity: 1; filter: blur(0px); transform: scale(1.3); }
            15% { transform: scale(1); }
            100% { transform: scale(4); opacity: 0; filter: blur(50px); }
        }

        /* 动态背景云层 */
        @keyframes wind {
            0% { transform: translateX(-100%) scale(1.5); }
            100% { transform: translateX(100%) scale(1.5); }
        }

        /* 雨滴下落 */
        @keyframes fall {
            0% { transform: translateY(-100vh) skewX(-15deg); }
            100% { transform: translateY(100vh) skewX(-15deg); }
        }

        /* 闪电 */
        @keyframes strobe {
            0%, 94%, 98%, 100% { opacity: 0; }
            95%, 97%, 99% { opacity: 0.4; }
        }

        .firework-text {
            animation: explode 2.5s 6s ease-out forwards;
        }

        .firework-trail {
            animation: rise 8s ease-out forwards;
        }

        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 10px; }

        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sparkle-button {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        /* 加载状态 */
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

    <!-- 背景系统 -->
    <div id="sky" class="fixed inset-0 z-0 transition-all duration-[3000ms] bg-gradient-to-b from-slate-950 via-indigo-950 to-black">
        <div id="celestial" class="absolute top-20 left-20 text-8xl transition-all duration-1000 transform translate-y-20 opacity-0">☀️</div>
        <div id="weather-layer" class="absolute inset-0 pointer-events-none"></div>
    </div>

    <!-- 烟花渲染层 -->
    <div id="firework-container" class="fixed inset-0 z-10 pointer-events-none flex items-center justify-center"></div>

    <!-- ================= 外页: 欢迎与倒计时 ================= -->
    <div id="landing-page" class="relative z-20 h-screen flex flex-col items-center justify-between py-12 px-6">
        <div class="text-center">
            <h1 class="text-6xl md:text-8xl font-black italic tracking-tighter drop-shadow-2xl animate-pulse">2026 MELAKA</h1>
            <p class="text-xl md:text-2xl text-yellow-400 font-bold mt-2 uppercase tracking-[0.5em]">Countdown Festival</p>
        </div>

        <div class="w-full max-w-3xl glass rounded-[50px] p-12 text-center shadow-2xl border-2 border-yellow-500/30">
            <h3 class="text-yellow-500 font-mono text-xs tracking-widest mb-4">DISTANCE TO NEW YEAR</h3>
            <div id="countdown-timer" class="text-5xl md:text-8xl font-black font-mono bg-gradient-to-r from-yellow-200 via-orange-400 to-red-600 bg-clip-text text-transparent leading-none">
                00d 00:00:00
            </div>
            
            <div class="mt-12 flex flex-col items-center gap-6">
               <button onclick="toggleModal('wish-modal', true)" class="group relative px-16 py-6 bg-red-600 rounded-full text-2xl md:text-3xl font-black shadow-xl transition-all hover:scale-105 active:scale-95 border-b-8 border-red-900">
                 <span class="relative z-10">🧧 提交祝福 · 进入现场</span>
               </button>
               <p id="entrance-hint" class="text-white/60 text-xs font-medium tracking-wide"></p>
            </div>
        </div>

        <button onclick="toggleModal('admin-modal', true)" class="w-12 h-12 glass rounded-full flex items-center justify-center opacity-50 hover:opacity-100 transition-opacity">🔑</button>
    </div>

    <!-- ================= 内页: 主互动面板 ================= -->
    <div id="main-page" class="relative z-20 h-screen flex p-8 gap-8 hidden">
        <!-- 左侧: 祝福墙 -->
        <div class="w-[35%] flex flex-col glass rounded-[40px] overflow-hidden shadow-2xl">
            <div class="p-8 bg-red-600 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-black italic tracking-tighter">WISH WALL</h2>
                    <p class="text-[10px] opacity-70 uppercase font-bold tracking-widest">Live Broadcast</p>
                </div>
                <div id="wish-count" class="text-2xl font-black text-yellow-300">0</div>
            </div>
            <div id="wish-list" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar"></div>
        </div>

        <!-- 中间: 视觉 -->
        <div class="w-[30%] flex flex-col items-center justify-between py-12 pointer-events-none">
            <div id="clock" class="glass px-10 py-4 rounded-full border border-yellow-500/30 text-4xl font-black font-mono text-yellow-400 shadow-2xl">00:00:00</div>
            <div class="opacity-20 flex flex-col items-center">
                <div class="w-px h-32 bg-gradient-to-t from-transparent via-white to-transparent"></div>
            </div>
        </div>

        <!-- 右侧: 功能区 -->
        <div class="w-[35%] flex flex-col gap-8">
            <div class="glass p-10 rounded-[40px] border border-yellow-500/20 shadow-2xl">
                <h3 class="text-3xl font-black italic mb-8">ENTERTAINMENT</h3>
                <div class="grid grid-cols-2 gap-4" id="game-grid"></div>
                <!-- AI 运势插板 -->
                <div class="mt-6 p-4 bg-white/5 rounded-2xl border border-white/10">
                    <button onclick="generateAIHoroscope()" id="btn-ai-horoscope" class="w-full py-3 sparkle-button text-black font-black rounded-xl text-sm flex items-center justify-center gap-2">
                        ✨ 查看 2026 AI 运势
                    </button>
                    <div id="ai-fortune-result" class="mt-4 text-xs italic text-yellow-200/80 leading-relaxed hidden"></div>
                </div>
            </div>

            <div class="mt-auto glass p-8 rounded-[30px] text-center">
                <div class="flex justify-center gap-2 mb-4">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-ping" style="animation-delay: 0.2s"></span>
                </div>
                <p class="text-[10px] font-black uppercase tracking-[0.4em] opacity-40">Data Sync & AI Active</p>
            </div>
        </div>
    </div>

    <!-- ================= 弹窗集合 ================= -->
    
    <!-- 提交祝福 -->
    <div id="wish-modal" class="fixed inset-0 z-[100] glass flex items-center justify-center p-6 hidden">
        <div class="bg-red-600 w-full max-w-lg rounded-[50px] p-10 shadow-2xl border-4 border-yellow-400">
            <h2 class="text-4xl font-black text-center mb-8 italic text-yellow-300">SUBMIT WISH</h2>
            <div class="space-y-4 text-left">
                <input id="form-name" type="text" placeholder="您的名字 / Nickname" class="w-full bg-white/10 rounded-2xl px-6 py-4 outline-none border-2 border-white/20 focus:border-yellow-400 font-bold">
                <div class="relative">
                    <textarea id="form-wish" placeholder="2026 祈愿..." class="w-full bg-white/10 rounded-2xl px-6 py-4 h-32 resize-none outline-none border-2 border-white/20 focus:border-yellow-400 font-bold"></textarea>
                    <button id="btn-ai-polish" onclick="polishWish()" class="absolute right-4 bottom-4 px-3 py-1 bg-yellow-400 text-red-900 text-[10px] font-black rounded-lg shadow-lg hover:scale-105 transition-transform">
                        ✨ AI 润色
                    </button>
                </div>
                <div class="flex gap-4 pt-4">
                    <button onclick="toggleModal('wish-modal', false)" class="flex-1 py-4 bg-black/20 rounded-xl font-bold">返回</button>
                    <button id="btn-submit" class="flex-[2] py-4 bg-yellow-400 text-red-900 rounded-xl font-black text-xl shadow-lg">确认提交 🧧</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理员 -->
    <div id="admin-modal" class="fixed inset-0 z-[110] glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-10 rounded-[40px] w-full max-w-md border-2 border-blue-500 shadow-2xl">
            <h2 class="text-2xl font-black text-blue-400 mb-6 italic tracking-widest">ADMIN ACCESS</h2>
            <div class="space-y-4">
                <input id="adm-key" type="password" placeholder="KEYWORD" class="w-full bg-black/50 border-2 border-blue-900 rounded-xl px-5 py-3 text-sm focus:border-blue-400 outline-none">
                <div class="flex gap-4 pt-6">
                    <button onclick="toggleModal('admin-modal', false)" class="flex-1 text-slate-500 font-bold">关闭</button>
                    <button id="btn-admin-login" class="flex-[2] py-3 bg-blue-600 rounded-xl font-black shadow-lg">验证</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase & Gemini SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 环境配置 ---
        let firebaseConfig = {};
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            }
        } catch (e) { console.error("Firebase Config Error", e); }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'melaka-2026';
        const PUBLIC_PATH = ['artifacts', appId, 'public', 'data'];
        
        const apiKey = ""; // Canvas 运行时会自动提供
        let currentUser = null;
        let isAdmin = false;

        // --- Gemini API 工具函数 ---
        async function callGemini(prompt, systemPrompt = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，AI 暂时无法响应。";
                } catch (err) {
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                }
            }
            return "连接失败，请稍后再试。";
        }

        // --- AI 功能实现 ---
        window.polishWish = async () => {
            const textArea = document.getElementById('form-wish');
            const btn = document.getElementById('btn-ai-polish');
            const originalText = textArea.value.trim();
            if (!originalText) return alert("请先输入一些文字。");

            btn.disabled = true;
            btn.innerText = "✨ 润色中...";
            
            const systemPrompt = "你是一位极具文学素养的祝福语大师。请将用户的跨年祈愿润色得更具诗意、正式且充满希望，字数控制在50字以内。保持真诚。";
            const polished = await callGemini(`请润色这段跨年愿望：${originalText}`, systemPrompt);
            
            textArea.value = polished.replace(/["“”]/g, '').trim();
            btn.disabled = false;
            btn.innerText = "✨ AI 润色";
        };

        window.generateAIHoroscope = async () => {
            const resultDiv = document.getElementById('ai-fortune-result');
            const btn = document.getElementById('btn-ai-horoscope');
            
            btn.disabled = true;
            btn.classList.add('loading-dots');
            btn.innerText = "✨ 星象观测中";
            
            const prompt = `现在是马六甲时间 ${new Date().toLocaleString()}，作为一名赛博占星师，请为用户生成一条简短、炫酷且充满正能量的 2026 跨年运势短评（约40字）。`;
            const fortune = await callGemini(prompt, "你是一个生活在2026年的未来派占星师，语气神秘且充满科幻感。");
            
            resultDiv.innerText = fortune;
            resultDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.classList.remove('loading-dots');
            btn.innerText = "✨ 重新观测运势";
        };

        // --- 核心倒计时与天气逻辑 ---
        const getMLKTime = () => new Date(new Date().getTime() + (new Date().getTimezoneOffset() * 60000) + (3600000 * 8));
        const format = (date) => date.toLocaleTimeString('en-GB', { hour12: false });

        const updateWeather = (time) => {
            const hour = time.getHours();
            const sky = document.getElementById('sky');
            const celestial = document.getElementById('celestial');
            
            if (hour >= 6 && hour < 17) sky.className = "fixed inset-0 z-0 transition-all duration-[3000ms] bg-gradient-to-b from-cyan-400 via-blue-500 to-indigo-600";
            else if (hour >= 17 && hour < 19) sky.className = "fixed inset-0 z-0 transition-all duration-[3000ms] bg-gradient-to-b from-orange-600 via-pink-600 to-purple-950";
            else sky.className = "fixed inset-0 z-0 transition-all duration-[3000ms] bg-gradient-to-b from-slate-950 via-indigo-950 to-black";

            celestial.innerHTML = (hour >= 6 && hour < 18) ? "☀️" : "🌙";
            celestial.style.opacity = "1";
            celestial.style.transform = "translateY(0)";
        };

        const updateCountdown = () => {
            const now = getMLKTime();
            const target = new Date(2026, 0, 1, 0, 0, 0);
            const diff = target - now;
            updateWeather(now);
            document.getElementById('clock').innerText = format(now);
            
            if (diff <= 0) {
                document.getElementById('countdown-timer').innerText = "HAPPY NEW YEAR!";
            } else {
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('countdown-timer').innerText = `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
            const canEnter = isAdmin || (now.getMonth() === 11 && now.getDate() === 31 && now.getHours() >= 23);
            document.getElementById('entrance-hint').innerText = canEnter ? "✨ 入口已开放，进入现场" : `当前: ${format(now)} (23:00 开放)`;
        };

        // --- 数据同步 ---
        const startDataSync = () => {
            onSnapshot(collection(db, ...PUBLIC_PATH, 'wishes'), (snap) => {
                const wishes = snap.docs.map(d => d.data()).sort((a,b) => b.timestamp - a.timestamp);
                document.getElementById('wish-count').innerText = wishes.length;
                document.getElementById('wish-list').innerHTML = wishes.map(w => `
                    <div class="bg-white/5 p-6 rounded-3xl border border-white/5 hover:border-yellow-500/30 transition-all">
                        <div class="flex justify-between text-xs font-bold mb-3">
                            <span class="text-yellow-400">@${w.nickname}</span>
                            <span class="opacity-30">${w.timeLabel}</span>
                        </div>
                        <p class="text-lg font-bold">${w.wish}</p>
                    </div>
                `).join('');
            });
        };

        const initialize = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { await signInAnonymously(auth); }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        startDataSync();
                    }
                });
            } catch (err) { console.error("Auth Failed", err); }
        };

        // --- 事件绑定 ---
        window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('hidden', !show);
        window.toggleView = () => {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
        };

        document.getElementById('btn-submit').onclick = async () => {
            const name = document.getElementById('form-name').value;
            const wish = document.getElementById('form-wish').value;
            if(!name || !wish) return alert("内容不能为空");
            
            try {
                await addDoc(collection(db, ...PUBLIC_PATH, 'wishes'), {
                    nickname: name, wish: wish, timestamp: Date.now(), timeLabel: format(getMLKTime())
                });
                toggleModal('wish-modal', false);
                toggleView();
            } catch (err) { console.error(err); }
        };

        document.getElementById('btn-admin-login').onclick = () => {
            const k = document.getElementById('adm-key').value;
            if(k === "ShyuanQinn") {
                isAdmin = true;
                toggleModal('admin-modal', false);
                alert("管理员登录成功");
            }
        };

        // 初始化 UI
        const games = [
            { name: '方块', icon: '🧱', color: 'bg-blue-600' },
            { name: '拼图', icon: '🧩', color: 'bg-teal-600' },
            { name: '灯谜', icon: '🏮', color: 'bg-rose-600' },
            { name: '红包', icon: '🧧', color: 'bg-orange-600' },
        ];
        document.getElementById('game-grid').innerHTML = games.map(g => `
            <button class="${g.color} p-5 rounded-2xl flex flex-col items-center gap-2 hover:scale-105 transition-all active:scale-95 shadow-lg">
                <span class="text-3xl">${g.icon}</span>
                <span class="text-[10px] font-black">${g.name}</span>
            </button>
        `).join('');

        setInterval(updateCountdown, 1000);
        initialize();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 马六甲跨年互动盛典 (AI Powered)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        @keyframes rise {
            0% { transform: translateY(0) scaleX(0.5); opacity: 0; }
            5% { opacity: 0.8; }
            75% { transform: translateY(-75vh) scaleX(1); opacity: 0.8; }
            80% { opacity: 1; }
            100% { transform: translateY(-75vh) scaleX(1); opacity: 0; }
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 0; filter: blur(30px); }
            5% { opacity: 1; filter: blur(0px); transform: scale(1.3); }
            15% { transform: scale(1); }
            100% { transform: scale(4); opacity: 0; filter: blur(50px); }
        }

        .firework-text { animation: explode 2.5s 6s ease-out forwards; }
        .firework-trail { animation: rise 8s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 10px; }

        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sparkle-button {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        /* 验证步骤指示器 */
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.3s; }
        .step-dot.active { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
    </style>
</head>
<body>

    <!-- 背景系统 -->
    <div id="sky" class="fixed inset-0 z-0 transition-all duration-[3000ms] bg-gradient-to-b from-slate-950 via-indigo-950 to-black">
        <div id="celestial" class="absolute top-20 left-20 text-8xl transition-all duration-1000 transform translate-y-20 opacity-0">☀️</div>
        <div id="weather-layer" class="absolute inset-0 pointer-events-none"></div>
    </div>

    <!-- 烟花渲染层 -->
    <div id="firework-container" class="fixed inset-0 z-10 pointer-events-none flex items-center justify-center"></div>

    <!-- ================= 外页: 欢迎与倒计时 ================= -->
    <div id="landing-page" class="relative z-20 h-screen flex flex-col items-center justify-between py-12 px-6">
        <div class="text-center">
            <h1 class="text-6xl md:text-8xl font-black italic tracking-tighter drop-shadow-2xl animate-pulse">2026 MELAKA</h1>
            <p class="text-xl md:text-2xl text-yellow-400 font-bold mt-2 uppercase tracking-[0.5em]">Countdown Festival</p>
        </div>

        <div class="w-full max-w-3xl glass rounded-[50px] p-12 text-center shadow-2xl border-2 border-yellow-500/30">
            <h3 class="text-yellow-500 font-mono text-xs tracking-widest mb-4">DISTANCE TO NEW YEAR</h3>
            <div id="countdown-timer" class="text-5xl md:text-8xl font-black font-mono bg-gradient-to-r from-yellow-200 via-orange-400 to-red-600 bg-clip-text text-transparent leading-none">
                00d 00:00:00
            </div>
            
            <div class="mt-12 flex flex-col items-center gap-6">
               <button onclick="toggleModal('wish-modal', true)" class="group relative px-16 py-6 bg-red-600 rounded-full text-2xl md:text-3xl font-black shadow-xl transition-all hover:scale-105 active:scale-95 border-b-8 border-red-900">
                 <span class="relative z-10">🧧 提交祝福 · 进入现场</span>
               </button>
               <p id="entrance-hint" class="text-white/60 text-xs font-medium tracking-wide"></p>
            </div>
        </div>

        <div class="flex gap-4">
            <button onclick="toggleModal('admin-modal', true)" class="w-12 h-12 glass rounded-full flex items-center justify-center opacity-50 hover:opacity-100 transition-opacity">🔑</button>
            <button onclick="toggleModal('ai-config-modal', true)" class="w-12 h-12 glass rounded-full flex items-center justify-center opacity-50 hover:opacity-100 transition-opacity">🤖</button>
        </div>
    </div>

    <!-- ================= 内页: 主互动面板 ================= -->
    <div id="main-page" class="relative z-20 h-screen flex p-8 gap-8 hidden">
        <div class="w-[35%] flex flex-col glass rounded-[40px] overflow-hidden shadow-2xl">
            <div class="p-8 bg-red-600 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-black italic tracking-tighter">WISH WALL</h2>
                    <p class="text-[10px] opacity-70 uppercase font-bold tracking-widest">Live Broadcast</p>
                </div>
                <div id="wish-count" class="text-2xl font-black text-yellow-300">0</div>
            </div>
            <div id="wish-list" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar"></div>
        </div>

        <div class="w-[30%] flex flex-col items-center justify-between py-12 pointer-events-none">
            <div id="clock" class="glass px-10 py-4 rounded-full border border-yellow-500/30 text-4xl font-black font-mono text-yellow-400 shadow-2xl">00:00:00</div>
            <div class="opacity-20 flex flex-col items-center">
                <div class="w-px h-32 bg-gradient-to-t from-transparent via-white to-transparent"></div>
            </div>
        </div>

        <div class="w-[35%] flex flex-col gap-8">
            <div class="glass p-10 rounded-[40px] border border-yellow-500/20 shadow-2xl">
                <h3 class="text-3xl font-black italic mb-8">ENTERTAINMENT</h3>
                <div class="grid grid-cols-2 gap-4" id="game-grid"></div>
                <div class="mt-6 p-4 bg-white/5 rounded-2xl border border-white/10">
                    <button onclick="generateAIHoroscope()" id="btn-ai-horoscope" class="w-full py-3 sparkle-button text-black font-black rounded-xl text-sm flex items-center justify-center gap-2">
                        ✨ 查看 2026 AI 运势
                    </button>
                    <div id="ai-fortune-result" class="mt-4 text-xs italic text-yellow-200/80 leading-relaxed hidden"></div>
                </div>
            </div>

            <div class="mt-auto glass p-8 rounded-[30px] text-center">
                <div class="flex justify-center gap-2 mb-4">
                    <span id="sync-indicator" class="w-2 h-2 bg-yellow-500 rounded-full animate-ping"></span>
                    <span class="w-2 h-2 bg-yellow-500 rounded-full animate-ping" style="animation-delay: 0.2s"></span>
                </div>
                <p id="sync-status-text" class="text-[10px] font-black uppercase tracking-[0.4em] opacity-40">Local Mode</p>
            </div>
        </div>
    </div>

    <!-- AI 配置弹窗 -->
    <div id="ai-config-modal" class="fixed inset-0 z-[120] glass flex items-center justify-center p-6 hidden">
        <div class="bg-indigo-900 p-8 rounded-[40px] w-full max-w-md border-2 border-indigo-400 shadow-2xl">
            <h2 class="text-2xl font-black text-indigo-300 mb-4 italic">Gemini API 配置</h2>
            <input id="ai-api-key-input" type="password" placeholder="Paste your API Key here" class="w-full bg-black/40 border-2 border-indigo-700 rounded-xl px-4 py-3 text-sm focus:border-indigo-400 outline-none mb-6">
            <div class="flex gap-4">
                <button onclick="toggleModal('ai-config-modal', false)" class="flex-1 font-bold">关闭</button>
                <button onclick="saveAIKey()" class="flex-1 py-3 bg-indigo-500 rounded-xl font-black">保存配置</button>
            </div>
        </div>
    </div>

    <!-- 提交祝福弹窗 -->
    <div id="wish-modal" class="fixed inset-0 z-[100] glass flex items-center justify-center p-6 hidden">
        <div class="bg-red-600 w-full max-w-lg rounded-[50px] p-10 shadow-2xl border-4 border-yellow-400">
            <h2 class="text-4xl font-black text-center mb-8 italic text-yellow-300">SUBMIT WISH</h2>
            <div class="space-y-4 text-left">
                <input id="form-name" type="text" placeholder="您的名字 / Nickname" class="w-full bg-white/10 rounded-2xl px-6 py-4 outline-none border-2 border-white/20 focus:border-yellow-400 font-bold">
                <div class="relative">
                    <textarea id="form-wish" placeholder="2026 祈愿..." class="w-full bg-white/10 rounded-2xl px-6 py-4 h-32 resize-none outline-none border-2 border-white/20 focus:border-yellow-400 font-bold"></textarea>
                    <button id="btn-ai-polish" onclick="polishWish()" class="absolute right-4 bottom-4 px-3 py-1 bg-yellow-400 text-red-900 text-[10px] font-black rounded-lg shadow-lg hover:scale-105 transition-transform">
                        ✨ AI 润色
                    </button>
                </div>
                <div class="flex gap-4 pt-4">
                    <button onclick="toggleModal('wish-modal', false)" class="flex-1 py-4 bg-black/20 rounded-xl font-bold">返回</button>
                    <button id="btn-submit" class="flex-[2] py-4 bg-yellow-400 text-red-900 rounded-xl font-black text-xl shadow-lg">确认提交 🧧</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 管理员三重验证弹窗 -->
    <div id="admin-modal" class="fixed inset-0 z-[110] glass flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-10 rounded-[40px] w-full max-w-md border-2 border-blue-500 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-blue-400 italic tracking-widest">IDENTITY CHECK</h2>
                <!-- 进度指示器 -->
                <div class="flex gap-2">
                    <div id="step-1-dot" class="step-dot active"></div>
                    <div id="step-2-dot" class="step-dot"></div>
                    <div id="step-3-dot" class="step-dot"></div>
                </div>
            </div>

            <div class="space-y-4">
                <p id="admin-label" class="text-xs font-bold text-white/50 uppercase tracking-widest">Step 1: 请输入暗语 (Keyword)</p>
                <input id="adm-key" type="password" placeholder="..." class="w-full bg-black/50 border-2 border-blue-900 rounded-xl px-5 py-3 text-sm focus:border-blue-400 outline-none">
                
                <div class="flex flex-wrap gap-4 pt-6" id="admin-actions">
                    <button id="btn-admin-close" onclick="resetAdminFlow(); toggleModal('admin-modal', false);" class="flex-1 text-slate-500 font-bold">取消</button>
                    <button id="btn-admin-next" onclick="processAdminStep()" class="flex-[2] py-3 bg-blue-600 rounded-xl font-black shadow-lg">下一步</button>
                    
                    <!-- 验证成功后显示的快捷进入按钮 -->
                    <button id="btn-quick-enter" onclick="toggleView(); toggleModal('admin-modal', false);" class="w-full py-4 bg-green-600 rounded-xl font-black shadow-lg hidden animate-bounce">🚀 验证完毕 · 直接进入现场</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let firebaseConfig = null;
        let useFirebase = false;
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                useFirebase = true;
            }
        } catch (e) {}

        window.GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || "";

        window.saveAIKey = () => {
            const val = document.getElementById('ai-api-key-input').value;
            if(val) {
                window.GEMINI_API_KEY = val;
                localStorage.setItem('gemini_api_key', val);
                toggleModal('ai-config-modal', false);
            }
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'melaka-2026';
        const PUBLIC_PATH = ['artifacts', appId, 'public', 'data'];
        let isAdmin = false;

        // 管理员三步验证逻辑
        let adminStep = 1;
        const ADMIN_FLOW = {
            1: { label: "Step 1: 请输入暗语 (Keyword)", key: "ShyuanQinn" },
            2: { label: "Step 2: 请输入暗号 (Secret Code)", key: "KADETJPJ2025" },
            3: { label: "Step 3: 请输入密码 (Password)", key: "MoeStar!2025" }
        };

        window.resetAdminFlow = () => {
            adminStep = 1;
            isAdmin = false;
            document.getElementById('admin-label').innerText = ADMIN_FLOW[1].label;
            document.getElementById('adm-key').value = '';
            document.getElementById('adm-key').classList.remove('hidden');
            document.getElementById('btn-admin-next').classList.remove('hidden');
            document.getElementById('btn-quick-enter').classList.add('hidden');
            for(let i=1; i<=3; i++) document.getElementById(`step-${i}-dot`).className = `step-dot ${i===1?'active':''}`;
        };

        window.processAdminStep = () => {
            const inputVal = document.getElementById('adm-key').value;
            const targetKey = ADMIN_FLOW[adminStep].key;

            if (inputVal === targetKey) {
                if (adminStep < 3) {
                    adminStep++;
                    document.getElementById('admin-label').innerText = ADMIN_FLOW[adminStep].label;
                    document.getElementById('adm-key').value = '';
                    document.getElementById(`step-${adminStep}-dot`).classList.add('active');
                } else {
                    // 全部通过
                    isAdmin = true;
                    document.getElementById('admin-label').innerText = "Identity Verified (身份已确认)";
                    document.getElementById('adm-key').classList.add('hidden');
                    document.getElementById('btn-admin-next').classList.add('hidden');
                    document.getElementById('btn-quick-enter').classList.remove('hidden');
                }
            } else {
                alert("验证失败，请重新输入当前步骤内容。");
                document.getElementById('adm-key').value = '';
            }
        };

        async function callGemini(prompt, systemPrompt = "") {
            if (!window.GEMINI_API_KEY) return null;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${window.GEMINI_API_KEY}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text;
        }

        window.polishWish = async () => {
            const textArea = document.getElementById('form-wish');
            const originalText = textArea.value.trim();
            if (!originalText) return;
            const res = await callGemini(`请润色：${originalText}`, "祝福语大师。");
            if (res) textArea.value = res.replace(/["“”]/g, '').trim();
        };

        window.generateAIHoroscope = async () => {
            const resultDiv = document.getElementById('ai-fortune-result');
            const res = await callGemini(`生成2026跨年运势短评。`, "未来占星师。");
            if (res) { resultDiv.innerText = res; resultDiv.classList.remove('hidden'); }
        };

        const handleWishesUpdate = (wishes) => {
            wishes.sort((a,b) => b.timestamp - a.timestamp);
            document.getElementById('wish-count').innerText = wishes.length;
            document.getElementById('wish-list').innerHTML = wishes.map(w => `
                <div class="bg-white/5 p-6 rounded-3xl border border-white/5 hover:border-yellow-500/30">
                    <div class="flex justify-between text-xs font-bold mb-3">
                        <span class="text-yellow-400">@${w.nickname}</span>
                        <span class="opacity-30">${w.timeLabel}</span>
                    </div>
                    <p class="text-lg font-bold">${w.wish}</p>
                </div>
            `).join('');
        };

        const initialize = async () => {
            if (useFirebase && firebaseConfig) {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { await signInAnonymously(auth); }
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        onSnapshot(collection(db, ...PUBLIC_PATH, 'wishes'), (snap) => {
                            handleWishesUpdate(snap.docs.map(d => d.data()));
                        });
                    }
                });
            } else {
                handleWishesUpdate(JSON.parse(localStorage.getItem('local_wishes') || '[]'));
            }
        };

        const getMLKTime = () => new Date(new Date().getTime() + (new Date().getTimezoneOffset() * 60000) + (3600000 * 8));
        const format = (date) => date.toLocaleTimeString('en-GB', { hour12: false });

        const updateUI = () => {
            const now = getMLKTime();
            const target = new Date(2026, 0, 1, 0, 0, 0);
            const diff = target - now;
            document.getElementById('clock').innerText = format(now);
            if (diff <= 0) {
                document.getElementById('countdown-timer').innerText = "HAPPY NEW YEAR!";
            } else {
                const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
                document.getElementById('countdown-timer').innerText = `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
            const canEnter = isAdmin || (now.getMonth() === 11 && now.getDate() === 31 && now.getHours() >= 23);
            document.getElementById('entrance-hint').innerText = canEnter ? "✨ 入口已开放" : `当前: ${format(now)} (23:00 开放)`;
        };

        window.toggleModal = (id, show) => document.getElementById(id).classList.toggle('hidden', !show);
        window.toggleView = () => {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
        };

        document.getElementById('btn-submit').onclick = async () => {
            const name = document.getElementById('form-name').value;
            const wishText = document.getElementById('form-wish').value;
            const data = { nickname: name, wish: wishText, timestamp: Date.now(), timeLabel: format(getMLKTime()) };
            if (useFirebase) { await addDoc(collection(getFirestore(), ...PUBLIC_PATH, 'wishes'), data); } 
            else { 
                const local = JSON.parse(localStorage.getItem('local_wishes') || '[]');
                local.push(data);
                localStorage.setItem('local_wishes', JSON.stringify(local));
                handleWishesUpdate(local);
            }
            toggleModal('wish-modal', false); toggleView();
        };

        document.getElementById('game-grid').innerHTML = ['🧱','🧩','🏮','🧧'].map(icon => `
            <button class="bg-white/5 p-5 rounded-2xl flex flex-col items-center gap-2 hover:scale-105 transition-all">
                <span class="text-3xl">${icon}</span>
            </button>
        `).join('');

        setInterval(updateUI, 1000);
        initialize();
    </script>
</body>
</html>
